name: Repository Dump

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      output_filename:
        description: 'Output filename for repository dump'
        required: false
        default: 'REPO_DUMP.md'
        type: string

permissions:
  contents: read

jobs:
  dump:
    name: Dump Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Repository Dump
        run: |
          python3 scripts/repo2md.py -o "${{ inputs.output_filename || 'REPO_DUMP.md' }}"

      - name: Upload Repository Dump Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-dump
          path: ${{ inputs.output_filename || 'REPO_DUMP.md' }}

      - name: Send Dump to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ inputs.output_filename || 'REPO_DUMP.md' }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          CAPTION="🌟 STARRY Repository Dump
          🔨 Commit: ${{ github.sha }}
          📝 Message: ${COMMIT_MSG}
          👤 Author: ${{ github.actor }}"

          curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
               -F caption="${CAPTION}" \
               -F document=@"${FILENAME}" \
               https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
