name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish'
        required: false
        default: '0.1.0'
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Pack
        run: dotnet pack src/Starry.Cli/Starry.Cli.csproj --configuration Release -o nupkg

      - name: Push to NuGet.org
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_KEY" ]; then
            dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "NUGET_API_KEY secret is not configured in repository secrets."
          fi
